# Revision 3: image-model-compatible generation
name: Generate Pip & Lumi Short

on:
  workflow_dispatch:
    inputs:
      episode_seed:
        description: Optional story premise
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/generate.yml

permissions:
  contents: write

concurrency:
  group: pip-lumi-short-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate setup and secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/validate_setup.py --online

      - name: Generate finished Short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_SCRIPT_MODEL: ${{ vars.OPENAI_SCRIPT_MODEL || 'auto' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'auto' }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'JBFqnCBsd6RMkjVDRZzb' }}
          MAX_ESTIMATED_COST_USD: ${{ vars.MAX_ESTIMATED_COST_USD || '7.00' }}
          EPISODE_SEED: ${{ github.event.inputs.episode_seed || format('Fresh continuation episode {0}', github.run_number) }}
        run: python scripts/generate_short.py

      - name: Upload finished episode
        uses: actions/upload-artifact@v4
        with:
          name: pip-lumi-episode-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pip-lumi-diagnostics-${{ github.run_number }}
          path: |
            work/**/episode-plan.json
            work/**/script-review.json
            work/**/frame-review.json
            work/**/frames/*.jpg
          if-no-files-found: ignore
          retention-days: 7

      - name: Record episode continuity
        run: |
          git add state/history.json
          if ! git diff --cached --quiet; then
            git config user.name "pip-lumi-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "chore: record generated episode ${{ github.run_number }}"
            git push
          fi
